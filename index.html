<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c120b">
<title>Ludo 3D – Önizleme</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }
</script>
</head>
<body>
<div id="bg"></div>
<canvas id="c"></canvas>
<header id="top">
  <div class="brand">LUDO <span>3D</span></div>
  <div id="turn" class="pill"><i></i><b>Sıra: Kırmızı</b></div>
  <button id="sound" class="icon" aria-label="Ses">🔊</button>
</header>
<div id="players">
  <div class="pl p0" data-i="0"><i></i><span>Sen</span><em>0/4</em></div>
  <div class="pl p1" data-i="1"><i></i><span>Yeşil Bot</span><em>0/4</em></div>
  <div class="pl p2" data-i="2"><i></i><span>Sarı Bot</span><em>0/4</em></div>
  <div class="pl p3" data-i="3"><i></i><span>Mavi Bot</span><em>0/4</em></div>
</div>
<div id="msg">Yükleniyor…</div>
<footer id="bottom">
  <button id="roll" class="btn">🎲 Zar At</button>
</footer>
<div id="overlay" class="hidden">
  <div class="card">
    <div id="trophy">🏆</div>
    <h1 id="winTitle">Kazandın!</h1>
    <p id="winSub">Tüm piyonların evde.</p>
    <button id="restart" class="btn">Tekrar Oyna</button>
  </div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
